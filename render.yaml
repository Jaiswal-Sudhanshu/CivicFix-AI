# CivicFix AI - Render Infrastructure Blueprint
# Multi-Service Architecture: FastAPI Forensics Backend + Vite React SPA Frontend

services:
  # 1. AI Forensics & Geospatial Backend Service
  - type: web
    name: civicfix-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: GEMINI_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production

  # 2. Modern React SPA Frontend Service
  - type: web
    name: civicfix-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: civicfix-backend
          property: host
      - key: VITE_GEMINI_API_KEY
        sync: false
